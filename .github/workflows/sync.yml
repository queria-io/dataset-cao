name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 景気ウォッチャー調査は毎月 8 日前後に公表される。四半期別 GDP 速報と県民経済計算は、公表後の最初の回で取り込む。毎月 12 日 04:00 JST に取る
    - cron: "0 19 11 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@03f0facbec0d7795c3b95cbcacedc1d26e500591
    with:
      dataset_name: cao
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
