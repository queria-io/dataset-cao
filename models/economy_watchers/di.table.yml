schema: economy_watchers
name: di
title: 景気ウォッチャー調査 DI
description: |-
  内閣府の景気ウォッチャー調査の DI（景気の現状判断・先行き判断）の推移です。1 行が 1 系列の 1 か月です。

  - adjustment が seasonally_adjusted の行は季節調整値で、全国の分野別（2002 年 1 月から）と地域別の合計を持ちます。original の行は原数値で、全国の分野・業種別（2000 年 1 月から）と、地域別の合計・家計動向関連（2000 年 10 月から）を持ちます
  - judgment は current（現状判断、3 か月前と比べた方向性）、outlook（先行き判断、2〜3 か月先の方向性）、current_level（現状判断の水準）です
  - DI は 5 段階の回答に点数（良くなっている 1、やや良くなっている 0.75、変わらない 0.5、やや悪くなっている 0.25、悪くなっている 0）を付けて、構成比を掛けて足したものです。50 が横ばいを表します
  - 全国の行は region が 全国 です。field が 合計 の行は家計動向関連・企業動向関連・雇用関連を合わせた値です。sector は業種で、分野全体の行は NULL です
  - 季節調整値は年に一度遡って改定されます
sources:
  - path: https://www5.cao.go.jp/keizai3/watcher/watcher_menu.html
fields:
  - name: adjustment
    title: 季節調整
    description: seasonally_adjusted（季節調整値）・original（原数値）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: judgment
    title: 判断
    description: current（現状判断・方向性）・outlook（先行き判断・方向性）・current_level（現状判断・水準）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: survey_month
    title: 調査月
    description: 調査した月の 1 日。公表は翌月
  - name: region
    title: 地域
    description: 全国・北海道・東北・北関東・南関東・東京都・甲信越・東海・北陸・近畿・中国・四国・九州・沖縄など。関東は北関東と南関東を、南関東は東京都を含みます
    annotations: { queria: { semantic: { role: dimension } } }
  - name: field
    title: 分野
    description: 合計・家計動向関連・企業動向関連・雇用関連
    annotations: { queria: { semantic: { role: dimension } } }
  - name: sector
    title: 業種
    description: 小売関連・飲食関連・百貨店・製造業など。小売関連と、その中の百貨店などの行が並びます。分野全体の行は NULL
    annotations: { queria: { semantic: { role: dimension } } }
  - name: di
    title: DI
    annotations: { queria: { semantic: { role: measure } } }
