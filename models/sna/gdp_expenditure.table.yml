schema: sna
name: gdp_expenditure
title: 国内総生産（支出側）と各需要項目
description: |-
  内閣府の四半期別 GDP 速報の、国内総生産（支出側）と各需要項目です。最新の速報の名目・実質の実額とデフレーターを、四半期・年度・暦年で収録します。1 行が 1 項目の 1 期です。

  - measure で名目（nominal）・実質（real）・デフレーター（deflator）を、adjustment で原系列（original）と季節調整系列（seasonally_adjusted）を、frequency で四半期・年度・暦年を選びます。年度と暦年は原系列だけです
  - 季節調整系列の実額は年率で表示しています（四半期の値を 4 倍した水準）。原系列の四半期の実額は年率ではありません
  - 実質は連鎖方式で、基準年は unit に書かれています。連鎖方式のため、実質の内訳を足しても合計に一致しません
  - item は「民間最終消費支出 > 家計最終消費支出」のように、統計表の見出しの階層を「 > 」でつないだものです。合計と内訳の行が並んでいるので、足し合わせると重複します
  - 季節調整系列は速報のたびに 1994 年まで遡って改定され、原系列も直近の数年が改定されます。release が収録した速報です
primary_key: [measure, adjustment, frequency, period_start, item]
sources:
  - path: https://www.esri.cao.go.jp/jp/sna/data/data_list/sokuhou/files/files_sokuhou.html
fields:
  - name: release
    title: 速報
    description: 収録した速報。例：2026年4-6月期2次速報値
  - name: release_date
    title: 公表日
  - name: measure
    title: 系列
    description: nominal（名目）・real（実質）・deflator（デフレーター）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: adjustment
    title: 季節調整
    description: original（原系列）・seasonally_adjusted（季節調整系列）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: frequency
    title: 周期
    description: quarter（四半期）・fiscal_year（年度、4 月から翌年 3 月）・calendar_year（暦年）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: year
    title: 年
    description: 四半期と暦年は暦年、年度は年度の始まる年
  - name: quarter
    title: 四半期
    description: 1 が 1-3 月期、4 が 10-12 月期。年度と暦年は NULL
  - name: period_start
    title: 期の初日
    description: 四半期はその期の最初の月の 1 日、年度は 4 月 1 日、暦年は 1 月 1 日
  - name: item
    title: 項目
    description: 統計表の見出しの階層を「 > 」でつないだもの。例：国内総生産(支出側)、民間最終消費支出 > 家計最終消費支出、財貨・サービス > 輸出
    annotations: { queria: { semantic: { role: dimension } } }
  - name: item_level
    title: 項目の階層
    description: item の階層の深さ。1 が最上位
  - name: value
    title: 値
    description: 単位は unit
    annotations: { queria: { semantic: { role: measure } } }
  - name: unit
    title: 単位
    description: 名目は 10億円、実質は「2020暦年連鎖価格、10億円」、デフレーターは「2020暦年=100」のように、統計表に書かれた単位
