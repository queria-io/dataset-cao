version: 2

models:
  - name: gdp_expenditure
    columns:
      - name: measure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [nominal, real, deflator]
      - name: adjustment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [original, seasonally_adjusted]
      - name: frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [quarter, fiscal_year, calendar_year]
      - name: period_start
        data_tests: [not_null]
      - name: item
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
