version: 2

models:
  - name: observations
    columns:
      - name: table_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [summary, main_series]
      - name: area_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prefecture, national, block, designated_city]
      - name: fiscal_year
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
